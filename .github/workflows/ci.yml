name: Tracey CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'prototypes/**'
      - '.claude/**'
      - '.squad/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'prototypes/**'
      - '.claude/**'
      - '.squad/**'
  # E2E tests run only on demand until the tauri-driver harness exists (see job 5).
  workflow_dispatch:

# A new push to a PR cancels the run still in flight for the previous push.
# Runs on main are never cancelled, so every merged commit is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Debug info is useless in CI and makes Windows linking (PDBs) and the cache
  # noticeably slower and larger.
  CARGO_PROFILE_DEV_DEBUG: 0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Rust — clippy + unit tests
  # Debug-profile build only; the target dir is cached and saved from main
  # so PR runs start warm instead of compiling Tauri from scratch.
  # ─────────────────────────────────────────────
  rust:
    name: Rust (clippy + tests)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # 1.93.1
        with:
          toolchain: 1.93.1
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          # Only main writes the cache; PRs restore it. Keeps PR runs from
          # evicting each other within the repo's 10 GB cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # scripts/check.ps1 is the single definition of "the checks": clippy on
      # all targets and tests, each with and without the `test` feature.
      # Agents and humans run the same script locally before committing.
      - name: Rust checks — scripts/check.ps1
        shell: pwsh
        run: ./scripts/check.ps1 -Only rust

  # ─────────────────────────────────────────────
  # Job 2: .NET — format + build + unit tests
  # Pure managed code, so it runs on Linux in parallel with the Rust job.
  # ─────────────────────────────────────────────
  dotnet:
    name: .NET (format + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: .NET checks — scripts/check.ps1
        shell: pwsh
        run: ./scripts/check.ps1 -Only dotnet

      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dotnet-test-results
          path: src/Tracey.Tests/**/test-results.trx

  # ─────────────────────────────────────────────
  # Job 3: CVE audit
  # Only reads Cargo.lock, so no toolchain build is needed; cargo-audit is
  # installed as a prebuilt binary instead of compiled from source.
  # ─────────────────────────────────────────────
  audit:
    name: CVE Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit

      - name: CVE audit — cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

  # ─────────────────────────────────────────────
  # Job 4: Build Portable Exe  (T079)
  # Release builds are a separate, expensive compile; they only run on main,
  # after the checks pass. PRs never wait on this.
  # ─────────────────────────────────────────────
  build-portable:
    name: Build Portable Exe
    if: github.event_name == 'push'
    runs-on: windows-latest
    needs: [rust, dotnet, audit]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # 1.93.1
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-msvc

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # Blazor WASM must be published before cargo build so frontendDist is populated.
      - name: Publish Blazor WASM
        run: >
          dotnet publish src/Tracey.App
          -c Release
          -o src/Tracey.App/bin/Release/net10.0/publish

      - name: Build Tauri binary (release)
        # cargo build --release is used instead of `cargo tauri build` to avoid
        # requiring the Tauri CLI in CI.  The Blazor publish above satisfies the
        # frontendDist requirement used at runtime.
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Verify exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/target/release/tracey.exe")) {
            Write-Error "tracey.exe was not produced by the release build"
            exit 1
          }
          Write-Host "tracey.exe found — build PASSED"

      # ── Portable verification ──────────────────────────────────────────────
      # Copy the exe to a temporary directory (simulating "run from any folder")
      # and verify it starts cleanly and writes tracey.db to the exe directory
      # (not to AppData), confirming the portable path-resolution logic (T078).
      - name: Portable execution check
        shell: pwsh
        run: |
          $tmpDir = Join-Path $env:TEMP "tracey-portable-test-$(New-Guid)"
          New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
          Copy-Item "src-tauri/target/release/tracey.exe" "$tmpDir/"

          Write-Host "Starting tracey.exe from $tmpDir ..."
          $proc = Start-Process `
            -FilePath "$tmpDir/tracey.exe" `
            -WorkingDirectory $tmpDir `
            -PassThru

          # Give the app up to 3 seconds to initialise and write its DB.
          Start-Sleep -Seconds 3

          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            Write-Error "tracey.exe exited early with code $($proc.ExitCode)"
            exit 1
          }

          # Portable check: tracey.db must appear beside the exe, not in AppData.
          if (Test-Path "$tmpDir/tracey.db") {
            Write-Host "tracey.db created in exe directory — portable check PASSED"
          } else {
            Write-Error "tracey.db NOT found in exe directory — portable check FAILED"
            if (-not $proc.HasExited) { $proc.Kill() }
            exit 1
          }

          $proc.Kill()
          Write-Host "Portable verification complete"

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tracey-portable-exe
          path: src-tauri/target/release/tracey.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Job 5: E2E Tests  (manual only)
  # Tests drive Chromium against the Blazor WASM dev server at localhost:5000.
  # window.__TAURI__ is absent in this mode — IPC-dependent tests will fail;
  # continue-on-error: true is set until a tauri-driver CDP harness is wired
  # (pending `[features] test = []` + Tauri WebDriver in Cargo.toml).
  # Because the result cannot fail the run, it only runs via workflow_dispatch;
  # move it back to push/pull_request once it gates something.
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Setup .NET 10 (Blazor dev server)
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # Start the Blazor WASM dev server in the background so Playwright can
      # reach http://localhost:5000.  The server is stopped in the cleanup step.
      - name: Start Blazor dev server
        shell: pwsh
        run: |
          $proc = Start-Process dotnet `
            -ArgumentList "run --project src/Tracey.App --urls http://localhost:5000" `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -PassThru
          $proc.Id | Out-File "$env:RUNNER_TEMP\blazor-pid.txt"
          Write-Host "Blazor dev server starting (PID $($proc.Id))..."
          # Poll until the server responds or timeout after 120 s
          $timeout = 120; $elapsed = 0
          while ($elapsed -lt $timeout) {
            Start-Sleep -Seconds 3
            $elapsed += 3
            try {
              Invoke-WebRequest -Uri 'http://localhost:5000' -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop | Out-Null
              Write-Host "Dev server ready ($elapsed s)"
              break
            } catch {
              Write-Host "Waiting... ($elapsed s)"
            }
          }
          if ($elapsed -ge $timeout) {
            Write-Error "Blazor dev server did not respond within ${timeout}s"
            exit 1
          }

      # continue-on-error: true — tests that invoke Tauri IPC will fail in
      # pure-devserver mode (no window.__TAURI__). Tracked for full fix once
      # the `test` Cargo feature and tauri-driver harness are implemented.
      - name: Run Playwright E2E tests
        continue-on-error: true
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          if-no-files-found: ignore

      - name: Stop Blazor dev server
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\blazor-pid.txt") {
            $blazorPid = Get-Content "$env:RUNNER_TEMP\blazor-pid.txt"
            Stop-Process -Id $blazorPid -Force -ErrorAction SilentlyContinue
            Write-Host "Dev server (PID $blazorPid) stopped"
          }
